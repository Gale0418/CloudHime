name: CI

concurrency:
  group: cloudhime-ci-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

permissions:
  contents: read

jobs:
  test-inventory:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.inventory.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4

      - name: Build test matrix from inventory
        id: inventory
        shell: pwsh
        run: |
          $inventory = Get-Content -LiteralPath "ci/test_groups.json" -Raw | ConvertFrom-Json
          $groups = @($inventory.groups | ForEach-Object {
            [pscustomobject]@{
              name = $_.name
              paths = ($_.test_files -join " ")
            }
          })
          $matrix = [pscustomobject]@{ include = $groups } | ConvertTo-Json -Compress -Depth 10
          "matrix=$matrix" >> $env:GITHUB_OUTPUT
          Write-Host "CI test inventory loaded: $($groups.Count) groups"

  build-and-test:
    needs: test-inventory
    runs-on: windows-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.test-inventory.outputs.matrix) }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip

          if (-not (Test-Path requirements-ci.txt)) {
            throw "requirements-ci.txt is missing."
          }
          pip install --require-hashes -r requirements-ci-lock-win-amd64-py310.txt
          if ($LASTEXITCODE -ne 0) { throw "requirements-ci lock installation failed." }

      - name: Syntax Check
        run: |
          python -m compileall -q -x '(^|[\\/])(\.venv|build|dist)([\\/]|$)' .

      - name: Run Tests (${{ matrix.name }})
        env:
          QT_QPA_PLATFORM: offscreen
        shell: pwsh
        run: |
          $testFiles = '${{ matrix.paths }}' -split '\s+' | Where-Object { $_ }
          if ('${{ matrix.name }}' -eq 'ui') {
            & .\ci\run_pytest.ps1 -TestFiles $testFiles -IsolateUi
          } else {
            & .\ci\run_pytest.ps1 -TestFiles $testFiles
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
  dependency-contract:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Resolve dependencies in an isolated environment
        shell: pwsh
        run: |
          $venv = Join-Path $env:RUNNER_TEMP "cloudhime-dependency-venv"
          $report = Join-Path $env:RUNNER_TEMP "cloudhime-pip-report.json"
          $sbom = Join-Path $env:RUNNER_TEMP "cloudhime-sbom.cdx.json"
          python -m venv $venv
          $venvPython = Join-Path $venv "Scripts/python.exe"
          & $venvPython -m pip install --upgrade pip
          if ($LASTEXITCODE -ne 0) { throw "pip bootstrap install failed." }
          & $venvPython -m pip install --require-hashes --report $report -r requirements-ci-lock-win-amd64-py310.txt
          if ($LASTEXITCODE -ne 0) { throw "requirements installation failed." }
          & $venvPython -m pip check
          if ($LASTEXITCODE -ne 0) { throw "pip check failed." }


          python packaging\dependency_contract.py validate --report $report --requirements requirements-ci-lock-win-amd64-py310.txt --direct-requirements requirements-ci.txt --lock requirements-ci-lock-win-amd64-py310.txt --sbom-output $sbom
          if ($LASTEXITCODE -ne 0) { throw "dependency contract validation failed." }
          python packaging\dependency_contract.py verify --report $report --requirements requirements-ci-lock-win-amd64-py310.txt --direct-requirements requirements-ci.txt --lock requirements-ci-lock-win-amd64-py310.txt --sbom $sbom
          if ($LASTEXITCODE -ne 0) { throw "dependency SBOM verification failed." }

          $prodVenv = Join-Path $env:RUNNER_TEMP "cloudhime-production-dependency-venv"
          $prodReport = Join-Path $env:RUNNER_TEMP "cloudhime-production-pip-report.json"
          $prodSbom = Join-Path $env:RUNNER_TEMP "cloudhime-production-sbom.cdx.json"
          python -m venv $prodVenv
          if ($LASTEXITCODE -ne 0) { throw "production venv creation failed." }
          $prodPython = Join-Path $prodVenv "Scripts/python.exe"
          & $prodPython -m pip install --upgrade pip
          if ($LASTEXITCODE -ne 0) { throw "production pip bootstrap install failed." }
          & $prodPython -m pip install --require-hashes --report $prodReport -r requirements-lock-win-amd64-py310.txt
          if ($LASTEXITCODE -ne 0) { throw "production requirements installation failed." }
          & $prodPython -m pip check
          if ($LASTEXITCODE -ne 0) { throw "production pip check failed." }
          python packaging\dependency_contract.py validate --report $prodReport --requirements requirements-lock-win-amd64-py310.txt --direct-requirements requirements.txt --lock requirements-lock-win-amd64-py310.txt --sbom-output $prodSbom
          if ($LASTEXITCODE -ne 0) { throw "production dependency contract validation failed." }
          python packaging\dependency_contract.py verify --report $prodReport --requirements requirements-lock-win-amd64-py310.txt --direct-requirements requirements.txt --lock requirements-lock-win-amd64-py310.txt --sbom $prodSbom
          if ($LASTEXITCODE -ne 0) { throw "production dependency SBOM verification failed." }

      - name: Upload dependency provenance
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cloudhime-dependency-provenance
          path: |
            ${{ runner.temp }}/cloudhime-pip-report.json
            ${{ runner.temp }}/cloudhime-sbom.cdx.json
            ${{ runner.temp }}/cloudhime-production-pip-report.json
            ${{ runner.temp }}/cloudhime-production-sbom.cdx.json
          if-no-files-found: warn
  msix-contract:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Prepare MSIX contract fixture
        timeout-minutes: 5
        shell: pwsh
        run: |
          $dummyDist = Join-Path $env:RUNNER_TEMP "cloudhime-dummy-dist"
          $outputDir = Join-Path $env:RUNNER_TEMP "cloudhime-msix-output"
          New-Item -ItemType Directory -Force -Path $dummyDist, $outputDir | Out-Null
          $launchWaitSeconds = 5
          $probeMilliseconds = ($launchWaitSeconds + 5) * 1000
          $probeSource = @(
          'using System;'
          'using System.Threading;'
          'public static class Program {'
          '    [System.STAThread]'
          '    public static int Main() {'
          '        string systemRoot = Environment.GetEnvironmentVariable("SystemRoot") ?? "";'
          '        string expectedPath = systemRoot + @"\System32;" + systemRoot;'
          '        if (String.IsNullOrWhiteSpace(systemRoot)) return 11;'
          '        if (Environment.GetEnvironmentVariable("WINDIR") != systemRoot) return 12;'
          '        if (Environment.GetEnvironmentVariable("PATH") != expectedPath) return 13;'
          '        string[] forbidden = new[] { "PYTHONHOME", "PYTHONPATH", "VIRTUAL_ENV", "CONDA_PREFIX", "OLLAMA_HOST" };'
          '        foreach (string name in forbidden) {'
          '            if (!String.IsNullOrEmpty(Environment.GetEnvironmentVariable(name))) return 14;'
          '        }'
          '        Thread.Sleep(__PROBE_MS__);'
          '        return 0;'
          '    }'
          ' }'
          ) -join [Environment]::NewLine
          $probeSource = $probeSource.Replace("__PROBE_MS__", $probeMilliseconds.ToString())
          $probePath = Join-Path $dummyDist "CloudHime.exe"
          $probeSourcePath = Join-Path $dummyDist "CloudHime.cs"
          [IO.File]::WriteAllText($probeSourcePath, $probeSource, [Text.UTF8Encoding]::new($false))
          $csc = Join-Path $env:WINDIR "Microsoft.NET\Framework64\v4.0.30319\csc.exe"
          if (-not (Test-Path -LiteralPath $csc -PathType Leaf)) {
            throw "Windows C# compiler was not found: $csc"
          }
          & $csc /nologo /target:winexe /out:$probePath $probeSourcePath
          if ($LASTEXITCODE -ne 0) {
            throw "MSIX fixture environment probe compilation failed with code $LASTEXITCODE."
          }
          if (-not (Test-Path -LiteralPath $probePath -PathType Leaf)) {
            throw "MSIX fixture environment probe executable was not created."
          }
          Remove-Item -LiteralPath $probeSourcePath -Force
          $internalRoot = Join-Path $dummyDist "_internal"
          New-Item -ItemType Directory -Force -Path (Join-Path $internalRoot "assets"), (Join-Path $internalRoot "runtime") | Out-Null
          foreach ($logoFile in @("cloudhime_logo.png", "cloudhime_logo_44.png", "cloudhime_logo_50.png", "cloudhime_logo_150.png")) {
            Copy-Item -LiteralPath (Join-Path $env:GITHUB_WORKSPACE "assets/$logoFile") -Destination (Join-Path $internalRoot "assets/$logoFile")
          }
          foreach ($releaseFile in @("dictionary.json", "LICENSE", "THIRD_PARTY_NOTICES.md")) {
            Copy-Item -LiteralPath (Join-Path $env:GITHUB_WORKSPACE $releaseFile) -Destination (Join-Path $internalRoot $releaseFile)
          }
          $runtimeFiles = @(
            "llama-server.exe", "llama-server-impl.dll", "llama-common.dll",
            "llama.dll", "ggml.dll", "ggml-base.dll", "ggml-cpu-x64.dll",
            "ggml-cuda.dll", "mtmd.dll", "libomp140.x86_64.dll",
            "cublas64_12.dll", "cublasLt64_12.dll", "cudart64_12.dll"
          )
          foreach ($runtimeFile in $runtimeFiles) {
            Set-Content -LiteralPath (Join-Path $internalRoot "runtime/$runtimeFile") -Value "CloudHime CI runtime placeholder" -Encoding ascii
          }

          $runtimeRoot = Join-Path $internalRoot "runtime"
          $runtimeManifestFiles = @(
            Get-ChildItem -LiteralPath $runtimeRoot -File |
              Sort-Object FullName |
              ForEach-Object {
                $relativePath = $_.FullName.Substring($runtimeRoot.Length).TrimStart("\", "/")
                [ordered]@{
                  path = $relativePath
                  size = [int64]$_.Length
                  sha256 = (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash
                }
              }
          )
          $runtimeManifest = [ordered]@{
            schema_version = 1
            runtime = "llama-server"
            server = [ordered]@{
              path = "llama-server.exe"
              version = "CloudHime CI placeholder"
            }
            build = [ordered]@{
              source_commit = "ci-fixture"
              backend = "cuda"
              architecture = "x64"
            }
            files = $runtimeManifestFiles
          }
          $runtimeManifest |
            ConvertTo-Json -Depth 8 |
            Set-Content -LiteralPath (Join-Path $runtimeRoot "runtime-manifest.json") -Encoding utf8
          $provenanceSource = Join-Path $env:RUNNER_TEMP "cloudhime-provenance-fixture"
          New-Item -ItemType Directory -Force -Path $provenanceSource | Out-Null
          $fixtureReport = Join-Path $provenanceSource "report.json"
          $fixtureRequirements = Join-Path $provenanceSource "requirements.txt"
          $fixtureLock = Join-Path $provenanceSource "requirements-lock-win-amd64-py310.txt"
          $fixtureSbom = Join-Path $provenanceSource "sbom.cdx.json"
          $fixtureJson = '{"version":"1","pip_version":"26.0","environment":{"implementation_name":"cpython","python_version":"3.10.14","sys_platform":"win32","platform_machine":"AMD64"},"install":[{"download_info":{"url":"https://files.example.test/alpha-pkg-1.0.0-py3-none-any.whl","archive_info":{"hashes":{"sha256":"aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa"}}},"requested":true,"metadata":{"name":"alpha-pkg","version":"1.0.0","license_expression":"MIT","requires_dist":[]}}]}'
          [IO.File]::WriteAllText($fixtureReport, $fixtureJson + [Environment]::NewLine, [Text.UTF8Encoding]::new($false))
          [IO.File]::WriteAllText($fixtureRequirements, "alpha-pkg==1.0.0" + [Environment]::NewLine, [Text.UTF8Encoding]::new($false))
          [IO.File]::WriteAllText($fixtureLock, "alpha-pkg==1.0.0 --hash=sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa" + [Environment]::NewLine, [Text.UTF8Encoding]::new($false))
          python packaging\dependency_contract.py validate --report $fixtureReport --requirements $fixtureLock --direct-requirements $fixtureRequirements --lock $fixtureLock --sbom-output $fixtureSbom
          if ($LASTEXITCODE -ne 0) { throw "MSIX fixture dependency contract generation failed." }
          python packaging\release_provenance.py stage --report $fixtureReport --requirements $fixtureRequirements --lock $fixtureLock --sbom $fixtureSbom --output (Join-Path $internalRoot "provenance")
          if ($LASTEXITCODE -ne 0) { throw "MSIX fixture release provenance staging failed." }
          Write-Host "MSIX fixture prepared at $dummyDist"

      - name: Environment-isolated release executable smoke (structural)
        timeout-minutes: 5
        shell: pwsh
        run: |
          Write-Host "Structural launch smoke only. Functional vision smoke requires real runtime/model assets and uses packaging/release_functional_smoke.py."
          $executable = Join-Path (Join-Path $env:RUNNER_TEMP "cloudhime-dummy-dist") "CloudHime.exe"
          pwsh -NoLogo -NoProfile -File packaging/test_clean_machine.ps1 -ExecutablePath $executable -LaunchWaitSeconds 5
      - name: Build MSIX package
        timeout-minutes: 10
        shell: pwsh
        run: |
          $dummyDist = Join-Path $env:RUNNER_TEMP "cloudhime-dummy-dist"
          $outputDir = Join-Path $env:RUNNER_TEMP "cloudhime-msix-output"
          $builder = Join-Path $env:GITHUB_WORKSPACE "packaging/build_msix.ps1"
          Write-Host "Building package with $builder"
          pwsh -NoLogo -NoProfile -File $builder -DistDir $dummyDist -OutputDir $outputDir -Version 0.1.0.0 -Publisher "CN=CloudHime CI" -CreateUpload
          if ($LASTEXITCODE -ne 0) {
            throw "MSIX builder exited with code $LASTEXITCODE."
          }
          $package = Join-Path $outputDir "CloudHime-0.1.0.0-x64.msix"
          $upload = Join-Path $outputDir "CloudHime-0.1.0.0-x64.msixupload"
          if (-not (Test-Path -LiteralPath $package)) {
            throw "MSIX contract package was not created."
          }
          if (-not (Test-Path -LiteralPath $upload)) {
            throw "MSIX upload artifact was not created."
          }
          Get-Item -LiteralPath $package, $upload | Select-Object FullName, Length

      - name: Inspect and sign MSIX package
        timeout-minutes: 10
        shell: pwsh
        run: |
          $outputDir = Join-Path $env:RUNNER_TEMP "cloudhime-msix-output"
          $package = Join-Path $outputDir "CloudHime-0.1.0.0-x64.msix"
          $unpackDir = Join-Path $env:RUNNER_TEMP "cloudhime-msix-unpacked"
          New-Item -ItemType Directory -Force -Path $unpackDir | Out-Null
          $makeappx = Get-ChildItem -LiteralPath (Join-Path ([Environment]::GetFolderPath("ProgramFilesX86")) "Windows Kits\10\bin") -Filter "makeappx.exe" -Recurse -File |
            Sort-Object FullName -Descending | Select-Object -First 1
          if ($null -eq $makeappx) {
            throw "makeappx.exe was not found on the Windows runner."
          }
          Write-Host "Unpacking with $($makeappx.FullName)"
          & $makeappx.FullName unpack /v /p $package /d $unpackDir /o
          if ($LASTEXITCODE -ne 0) {
            throw "Failed to unpack MSIX contract package."
          }
          $manifestPath = Join-Path $unpackDir "AppxManifest.xml"
          if (-not (Test-Path -LiteralPath $manifestPath)) {
            throw "MSIX did not contain AppxManifest.xml after unpack."
          }
          [xml]$unpackedManifest = Get-Content -LiteralPath $manifestPath -Raw
          $namespaceManager = New-Object System.Xml.XmlNamespaceManager($unpackedManifest.NameTable)
          $namespaceManager.AddNamespace("foundation", "http://schemas.microsoft.com/appx/manifest/foundation/windows10")
          $namespaceManager.AddNamespace("uap", "http://schemas.microsoft.com/appx/manifest/uap/windows10")
          $namespaceManager.AddNamespace("rescap", "http://schemas.microsoft.com/appx/manifest/foundation/windows10/restrictedcapabilities")
          $application = $unpackedManifest.SelectSingleNode("/foundation:Package/foundation:Applications/foundation:Application", $namespaceManager)
          $visualElements = $application.SelectSingleNode("uap:VisualElements", $namespaceManager)
          $fullTrustCapability = $unpackedManifest.SelectSingleNode("/foundation:Package/foundation:Capabilities/rescap:Capability[@Name='runFullTrust']", $namespaceManager)
          if ($null -eq $application -or $application.Executable -ne "CloudHime.exe" -or $application.EntryPoint -ne "Windows.FullTrustApplication") {
            throw "Unpacked MSIX manifest has an unexpected desktop application entrypoint."
          }
          if ($null -eq $visualElements -or $visualElements.BackgroundColor -ne "#F4F7FB") {
            throw "Unpacked MSIX manifest has an unexpected visual background color."
          }
          if ($null -eq $fullTrustCapability) {
            throw "Unpacked MSIX manifest is missing the runFullTrust capability."
          }
          $runtimeFiles = @(
            "llama-server.exe", "llama-server-impl.dll", "llama-common.dll",
            "llama.dll", "ggml.dll", "ggml-base.dll", "ggml-cpu-x64.dll",
            "ggml-cuda.dll", "mtmd.dll", "libomp140.x86_64.dll",
            "cublas64_12.dll", "cublasLt64_12.dll", "cudart64_12.dll"
          )
          foreach ($runtimeFile in $runtimeFiles) {
            $runtimePath = Join-Path $unpackDir "_internal/runtime/$runtimeFile"
            if (-not (Test-Path -LiteralPath $runtimePath)) {
              throw "MSIX omitted required runtime file: $runtimeFile"
            }
          }

          $runtimeManifestPath = Join-Path $unpackDir "_internal/runtime/runtime-manifest.json"
          if (-not (Test-Path -LiteralPath $runtimeManifestPath)) {
            throw "MSIX omitted runtime-manifest.json"
          }
          $runtimeManifest = Get-Content -LiteralPath $runtimeManifestPath -Raw | ConvertFrom-Json
          if ($runtimeManifest.schema_version -ne 1 -or
              $runtimeManifest.runtime -ne "llama-server" -or
              [string]::IsNullOrWhiteSpace([string]$runtimeManifest.server.version) -or
              [string]$runtimeManifest.build.architecture -ine "x64") {
            throw "MSIX contained an invalid runtime manifest"
          }
          $provenancePath = Join-Path $unpackDir "_internal\provenance\release-provenance.json"
          if (-not (Test-Path -LiteralPath $provenancePath)) {
            throw "MSIX omitted release dependency provenance"
          }
          python packaging\release_provenance.py verify --provenance-dir (Split-Path -Parent $provenancePath)
          if ($LASTEXITCODE -ne 0) { throw "Unpacked MSIX release provenance verification failed." }
          $verifier = Join-Path $env:GITHUB_WORKSPACE 'packaging\verify_release_dist.ps1'
          pwsh -NoLogo -NoProfile -File $verifier -DistDir $unpackDir -UnpackedMsix -ExpectedIdentityName "CloudHime" -ExpectedPublisher "CN=CloudHime CI" -ExpectedArchitecture "x64"
          if ($LASTEXITCODE -ne 0) { throw 'Unpacked MSIX release preflight failed.' }
          $signtoolCandidates = @(Get-ChildItem -LiteralPath (Join-Path ([Environment]::GetFolderPath("ProgramFilesX86")) "Windows Kits\10\bin") -Filter "signtool.exe" -Recurse -File |
            Sort-Object FullName -Descending)
          $signtool = $signtoolCandidates |
            Where-Object { $_.FullName -match 'x64[\\/]signtool\.exe$' } |
            Select-Object -First 1
          if ($null -eq $signtool) {
            $signtool = $signtoolCandidates | Select-Object -First 1
          }
          if ($null -eq $signtool) {
            throw "signtool.exe was not found on the Windows runner."
          }
          $signingDir = Join-Path $env:RUNNER_TEMP "cloudhime-signing"
          New-Item -ItemType Directory -Force -Path $signingDir | Out-Null
          Write-Host "Creating ephemeral CI signing certificate"
          $certificate = New-SelfSignedCertificate -Type CodeSigningCert -KeyExportPolicy Exportable -Subject "CN=CloudHime CI" -CertStoreLocation Cert:\CurrentUser\My
          "CLOUDHIME_CI_CERT_THUMBPRINT=$($certificate.Thumbprint)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "Created CI signing certificate $($certificate.Thumbprint)"
          $pfxPath = Join-Path $signingDir "cloudhime-ci.pfx"
          $cerPath = Join-Path $signingDir "cloudhime-ci.cer"
          $certificatePassword = ConvertTo-SecureString "ci-only" -AsPlainText -Force
          Write-Host "Exporting CI signing certificate"
          Export-PfxCertificate -Cert $certificate -FilePath $pfxPath -Password $certificatePassword | Out-Null
          Export-Certificate -Cert $certificate -FilePath $cerPath | Out-Null
          Write-Host "Trusting CI certificate in LocalMachine TrustedPeople"
          Import-Certificate -FilePath $cerPath -CertStoreLocation Cert:\LocalMachine\TrustedPeople | Out-Null
          Write-Host "Signing $package with $($signtool.FullName)"
          & $signtool.FullName sign /fd SHA256 /a /f $pfxPath /p "ci-only" $package
          if ($LASTEXITCODE -ne 0) {
            throw "signtool failed to sign the MSIX package."
          }

      - name: Install and uninstall MSIX package
        timeout-minutes: 10
        shell: pwsh
        run: |
          $package = Join-Path (Join-Path $env:RUNNER_TEMP "cloudhime-msix-output") "CloudHime-0.1.0.0-x64.msix"
          pwsh -NoLogo -NoProfile -File packaging/test_msix_install.ps1 -PackagePath $package -LaunchWaitSeconds 3

      - name: Clean up CI signing certificate
        if: always()
        timeout-minutes: 5
        shell: pwsh
        run: |
          $thumbprint = "$env:CLOUDHIME_CI_CERT_THUMBPRINT".Trim()
          if (-not $thumbprint) {
            Write-Warning "No CI certificate thumbprint was published; skipping certificate cleanup."
            return
          }
          $stores = @("Cert:\CurrentUser\My", "Cert:\LocalMachine\TrustedPeople")
          foreach ($store in $stores) {
            Get-ChildItem -Path $store -ErrorAction Stop |
              Where-Object { $_.Thumbprint -eq $thumbprint } |
              Remove-Item -Force -ErrorAction Stop
            $remaining = Get-ChildItem -Path $store -ErrorAction Stop |
              Where-Object { $_.Thumbprint -eq $thumbprint }
            if ($remaining) {
              throw "Failed to remove CI signing certificate $thumbprint from $store."
            }
          }
