name: CI

concurrency:
  group: cloudhime-ci-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

permissions:
  contents: read

jobs:
  test-inventory:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.inventory.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4

      - name: Build test matrix from inventory
        id: inventory
        shell: pwsh
        run: |
          $inventory = Get-Content -LiteralPath "ci/test_groups.json" -Raw | ConvertFrom-Json
          $groups = @($inventory.groups | ForEach-Object {
            [pscustomobject]@{
              name = $_.name
              paths = ($_.test_files -join " ")
            }
          })
          $matrix = [pscustomobject]@{ include = $groups } | ConvertTo-Json -Compress -Depth 10
          "matrix=$matrix" >> $env:GITHUB_OUTPUT
          Write-Host "CI test inventory loaded: $($groups.Count) groups"

  build-and-test:
    needs: test-inventory
    runs-on: windows-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.test-inventory.outputs.matrix) }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip

          if (-not (Test-Path requirements-ci.txt)) {
            throw "requirements-ci.txt is missing."
          }
          pip install -r requirements-ci.txt

      - name: Syntax Check
        run: |
          python -m compileall -q -x '(^|[\\/])(\.venv|build|dist)([\\/]|$)' .

      - name: Run Tests (${{ matrix.name }})
        env:
          QT_QPA_PLATFORM: offscreen
        shell: pwsh
        run: |
          $testFiles = '${{ matrix.paths }}' -split '\s+' | Where-Object { $_ }
          if ('${{ matrix.name }}' -eq 'ui') {
            foreach ($testFile in $testFiles) {
              Write-Host "Running isolated UI test file: $testFile"
              $pytestProcess = Start-Process -FilePath "python" -ArgumentList @("-m", "pytest", "-q", $testFile) -PassThru -NoNewWindow
              $completed = $pytestProcess.WaitForExit(120000)
              if (-not $completed) {
                Stop-Process -Id $pytestProcess.Id -Force
                throw "UI test file timed out after 120 seconds: $testFile"
              }
              if ($pytestProcess.ExitCode -ne 0) { exit $pytestProcess.ExitCode }
            }
          } else {
            python -m pytest -q @testFiles
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

  msix-contract:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Prepare MSIX contract fixture
        timeout-minutes: 5
        shell: pwsh
        run: |
          $dummyDist = Join-Path $env:RUNNER_TEMP "cloudhime-dummy-dist"
          $outputDir = Join-Path $env:RUNNER_TEMP "cloudhime-msix-output"
          New-Item -ItemType Directory -Force -Path $dummyDist, $outputDir | Out-Null
          Copy-Item -LiteralPath (Join-Path $env:WINDIR "System32\cmd.exe") -Destination (Join-Path $dummyDist "CloudHime.exe")
          $internalRoot = Join-Path $dummyDist "_internal"
          New-Item -ItemType Directory -Force -Path (Join-Path $internalRoot "assets"), (Join-Path $internalRoot "runtime") | Out-Null
          foreach ($logoFile in @("cloudhime_logo.png", "cloudhime_logo_44.png", "cloudhime_logo_50.png", "cloudhime_logo_150.png")) {
            Copy-Item -LiteralPath (Join-Path $env:GITHUB_WORKSPACE "assets/$logoFile") -Destination (Join-Path $internalRoot "assets/$logoFile")
          }
          foreach ($releaseFile in @("dictionary.json", "LICENSE", "THIRD_PARTY_NOTICES.md")) {
            Copy-Item -LiteralPath (Join-Path $env:GITHUB_WORKSPACE $releaseFile) -Destination (Join-Path $internalRoot $releaseFile)
          }
          $runtimeFiles = @(
            "llama-server.exe", "llama-server-impl.dll", "llama-common.dll",
            "llama.dll", "ggml.dll", "ggml-base.dll", "ggml-cpu-x64.dll",
            "ggml-cuda.dll", "mtmd.dll", "libomp140.x86_64.dll",
            "cublas64_12.dll", "cublasLt64_12.dll", "cudart64_12.dll"
          )
          foreach ($runtimeFile in $runtimeFiles) {
            Set-Content -LiteralPath (Join-Path $internalRoot "runtime/$runtimeFile") -Value "CloudHime CI runtime placeholder" -Encoding ascii
          }

          $runtimeRoot = Join-Path $internalRoot "runtime"
          $runtimeManifestFiles = @(
            Get-ChildItem -LiteralPath $runtimeRoot -File |
              Sort-Object FullName |
              ForEach-Object {
                $relativePath = $_.FullName.Substring($runtimeRoot.Length).TrimStart("\", "/")
                [ordered]@{
                  path = $relativePath
                  size = [int64]$_.Length
                  sha256 = (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash
                }
              }
          )
          $runtimeManifest = [ordered]@{
            schema_version = 1
            runtime = "llama-server"
            server = [ordered]@{
              path = "llama-server.exe"
              version = "CloudHime CI placeholder"
            }
            build = [ordered]@{
              source_commit = "ci-fixture"
              backend = "cuda"
              architecture = "x64"
            }
            files = $runtimeManifestFiles
          }
          $runtimeManifest |
            ConvertTo-Json -Depth 8 |
            Set-Content -LiteralPath (Join-Path $runtimeRoot "runtime-manifest.json") -Encoding utf8
          Write-Host "MSIX fixture prepared at $dummyDist"

      - name: Build MSIX package
        timeout-minutes: 10
        shell: pwsh
        run: |
          $dummyDist = Join-Path $env:RUNNER_TEMP "cloudhime-dummy-dist"
          $outputDir = Join-Path $env:RUNNER_TEMP "cloudhime-msix-output"
          $builder = Join-Path $env:GITHUB_WORKSPACE "packaging/build_msix.ps1"
          Write-Host "Building package with $builder"
          pwsh -NoLogo -NoProfile -File $builder -DistDir $dummyDist -OutputDir $outputDir -Version 0.1.0.0 -Publisher "CN=CloudHime CI" -CreateUpload
          if ($LASTEXITCODE -ne 0) {
            throw "MSIX builder exited with code $LASTEXITCODE."
          }
          $package = Join-Path $outputDir "CloudHime-0.1.0.0-x64.msix"
          $upload = Join-Path $outputDir "CloudHime-0.1.0.0-x64.msixupload"
          if (-not (Test-Path -LiteralPath $package)) {
            throw "MSIX contract package was not created."
          }
          if (-not (Test-Path -LiteralPath $upload)) {
            throw "MSIX upload artifact was not created."
          }
          Get-Item -LiteralPath $package, $upload | Select-Object FullName, Length

      - name: Inspect and sign MSIX package
        timeout-minutes: 10
        shell: pwsh
        run: |
          $outputDir = Join-Path $env:RUNNER_TEMP "cloudhime-msix-output"
          $package = Join-Path $outputDir "CloudHime-0.1.0.0-x64.msix"
          $unpackDir = Join-Path $env:RUNNER_TEMP "cloudhime-msix-unpacked"
          New-Item -ItemType Directory -Force -Path $unpackDir | Out-Null
          $makeappx = Get-ChildItem -LiteralPath (Join-Path ([Environment]::GetFolderPath("ProgramFilesX86")) "Windows Kits\10\bin") -Filter "makeappx.exe" -Recurse -File |
            Sort-Object FullName -Descending | Select-Object -First 1
          if ($null -eq $makeappx) {
            throw "makeappx.exe was not found on the Windows runner."
          }
          Write-Host "Unpacking with $($makeappx.FullName)"
          & $makeappx.FullName unpack /v /p $package /d $unpackDir /o
          if ($LASTEXITCODE -ne 0) {
            throw "Failed to unpack MSIX contract package."
          }
          $manifestPath = Join-Path $unpackDir "AppxManifest.xml"
          if (-not (Test-Path -LiteralPath $manifestPath)) {
            throw "MSIX did not contain AppxManifest.xml after unpack."
          }
          [xml]$unpackedManifest = Get-Content -LiteralPath $manifestPath -Raw
          $namespaceManager = New-Object System.Xml.XmlNamespaceManager($unpackedManifest.NameTable)
          $namespaceManager.AddNamespace("foundation", "http://schemas.microsoft.com/appx/manifest/foundation/windows10")
          $namespaceManager.AddNamespace("uap", "http://schemas.microsoft.com/appx/manifest/uap/windows10")
          $namespaceManager.AddNamespace("rescap", "http://schemas.microsoft.com/appx/manifest/foundation/windows10/restrictedcapabilities")
          $application = $unpackedManifest.SelectSingleNode("/foundation:Package/foundation:Applications/foundation:Application", $namespaceManager)
          $visualElements = $application.SelectSingleNode("uap:VisualElements", $namespaceManager)
          $fullTrustCapability = $unpackedManifest.SelectSingleNode("/foundation:Package/foundation:Capabilities/rescap:Capability[@Name='runFullTrust']", $namespaceManager)
          if ($null -eq $application -or $application.Executable -ne "CloudHime.exe" -or $application.EntryPoint -ne "Windows.FullTrustApplication") {
            throw "Unpacked MSIX manifest has an unexpected desktop application entrypoint."
          }
          if ($null -eq $visualElements -or $visualElements.BackgroundColor -ne "#F4F7FB") {
            throw "Unpacked MSIX manifest has an unexpected visual background color."
          }
          if ($null -eq $fullTrustCapability) {
            throw "Unpacked MSIX manifest is missing the runFullTrust capability."
          }
          $runtimeFiles = @(
            "llama-server.exe", "llama-server-impl.dll", "llama-common.dll",
            "llama.dll", "ggml.dll", "ggml-base.dll", "ggml-cpu-x64.dll",
            "ggml-cuda.dll", "mtmd.dll", "libomp140.x86_64.dll",
            "cublas64_12.dll", "cublasLt64_12.dll", "cudart64_12.dll"
          )
          foreach ($runtimeFile in $runtimeFiles) {
            $runtimePath = Join-Path $unpackDir "_internal/runtime/$runtimeFile"
            if (-not (Test-Path -LiteralPath $runtimePath)) {
              throw "MSIX omitted required runtime file: $runtimeFile"
            }
          }

          $runtimeManifestPath = Join-Path $unpackDir "_internal/runtime/runtime-manifest.json"
          if (-not (Test-Path -LiteralPath $runtimeManifestPath)) {
            throw "MSIX omitted runtime-manifest.json"
          }
          $runtimeManifest = Get-Content -LiteralPath $runtimeManifestPath -Raw | ConvertFrom-Json
          if ($runtimeManifest.schema_version -ne 1 -or
              $runtimeManifest.runtime -ne "llama-server" -or
              [string]::IsNullOrWhiteSpace([string]$runtimeManifest.server.version)) {
            throw "MSIX contained an invalid runtime manifest"
          }
          $signtoolCandidates = @(Get-ChildItem -LiteralPath (Join-Path ([Environment]::GetFolderPath("ProgramFilesX86")) "Windows Kits\10\bin") -Filter "signtool.exe" -Recurse -File |
            Sort-Object FullName -Descending)
          $signtool = $signtoolCandidates |
            Where-Object { $_.FullName -match 'x64[\\/]signtool\.exe$' } |
            Select-Object -First 1
          if ($null -eq $signtool) {
            $signtool = $signtoolCandidates | Select-Object -First 1
          }
          if ($null -eq $signtool) {
            throw "signtool.exe was not found on the Windows runner."
          }
          $signingDir = Join-Path $env:RUNNER_TEMP "cloudhime-signing"
          New-Item -ItemType Directory -Force -Path $signingDir | Out-Null
          Write-Host "Creating ephemeral CI signing certificate"
          $certificate = New-SelfSignedCertificate -Type CodeSigningCert -KeyExportPolicy Exportable -Subject "CN=CloudHime CI" -CertStoreLocation Cert:\CurrentUser\My
          "CLOUDHIME_CI_CERT_THUMBPRINT=$($certificate.Thumbprint)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "Created CI signing certificate $($certificate.Thumbprint)"
          $pfxPath = Join-Path $signingDir "cloudhime-ci.pfx"
          $cerPath = Join-Path $signingDir "cloudhime-ci.cer"
          $certificatePassword = ConvertTo-SecureString "ci-only" -AsPlainText -Force
          Write-Host "Exporting CI signing certificate"
          Export-PfxCertificate -Cert $certificate -FilePath $pfxPath -Password $certificatePassword | Out-Null
          Export-Certificate -Cert $certificate -FilePath $cerPath | Out-Null
          Write-Host "Trusting CI certificate in LocalMachine TrustedPeople"
          Import-Certificate -FilePath $cerPath -CertStoreLocation Cert:\LocalMachine\TrustedPeople | Out-Null
          Write-Host "Signing $package with $($signtool.FullName)"
          & $signtool.FullName sign /fd SHA256 /a /f $pfxPath /p "ci-only" $package
          if ($LASTEXITCODE -ne 0) {
            throw "signtool failed to sign the MSIX package."
          }

      - name: Install and uninstall MSIX package
        timeout-minutes: 10
        shell: pwsh
        run: |
          $package = Join-Path (Join-Path $env:RUNNER_TEMP "cloudhime-msix-output") "CloudHime-0.1.0.0-x64.msix"
          pwsh -NoLogo -NoProfile -File packaging/test_msix_install.ps1 -PackagePath $package

      - name: Clean up CI signing certificate
        if: always()
        timeout-minutes: 5
        shell: pwsh
        run: |
          $thumbprint = "$env:CLOUDHIME_CI_CERT_THUMBPRINT".Trim()
          if (-not $thumbprint) {
            Write-Warning "No CI certificate thumbprint was published; skipping certificate cleanup."
            return
          }
          $stores = @("Cert:\CurrentUser\My", "Cert:\LocalMachine\TrustedPeople")
          foreach ($store in $stores) {
            Get-ChildItem -Path $store -ErrorAction Stop |
              Where-Object { $_.Thumbprint -eq $thumbprint } |
              Remove-Item -Force -ErrorAction Stop
            $remaining = Get-ChildItem -Path $store -ErrorAction Stop |
              Where-Object { $_.Thumbprint -eq $thumbprint }
            if ($remaining) {
              throw "Failed to remove CI signing certificate $thumbprint from $store."
            }
          }
