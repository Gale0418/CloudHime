name: CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-and-test:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-qt
          if (Test-Path requirements.txt) {
            Get-Content requirements.txt |
              Where-Object { $_.Trim() -and $_.Trim() -ne 'llama-cpp-python' } |
              Set-Content requirements-ci.txt
            pip install -r requirements-ci.txt
            Remove-Item requirements-ci.txt -Force
          }

      - name: Syntax Check
        run: |
          python -m py_compile CloudHime.py cloudhime_core.py cloudhime_ui.py cloudhime_workers.py translation_providers.py cloudhime_logging.py

      - name: Run Tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python -m pytest -q tests